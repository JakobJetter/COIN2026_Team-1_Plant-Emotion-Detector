[project]
name = "coins-report"
version = "0.1.0"
description = "COINs / Springer T1-book styled report built with Quarto"
requires-python = ">=3.10"
dependencies = [
    "jupyter",
    "matplotlib",
    "numpy",
    "pandas",
]

# These are only needed if your .qmd files contain executable ```{python}```
# code cells. If you write a pure-prose report you can remove the code cell
# in sections/05-results.qmd and this file becomes optional.
