project:
  type: default
  output-dir: _output
  render:
    - report.qmd

# Shared metadata / options (can also live in report.qmd front matter)
bibliography: references.bib
csl: springer-basic-brackets.csl   # Springer Basic Style (numbered), per COINs template
link-citations: true    # in-text [n] jumps to the matching entry in the reference list
link-bibliography: true # DOIs/URLs in the reference list stay clickable
number-sections: true
indent: true            # keep Springer-style first-line paragraph indents
jupyter: python3        # only needed if you use executable code cells

format:
  pdf:
    pdf-engine: pdflatex          # mathptmx (Times) works cleanly with pdflatex
    documentclass: article        # article + titlesec gives the numbered bold headings
    classoption:
      - 10pt
    papersize: a4
    geometry:                     # Springer T1-book text block on A4
      - a4paper
      - top=5.0cm
      - bottom=5.6cm
      - left=4.7cm
      - right=4.6cm
      - headsep=1.1cm
      - footskip=1.6cm
    include-in-header: tex/preamble.tex
    template-partials:
      - partials/title.tex        # left-aligned Springer-style title/abstract block
    colorlinks: false
    toc: false
    keep-tex: true                # writes report.tex next to the PDF (handy for debugging)
